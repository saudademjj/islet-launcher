[package]
name = "islet"
version = "0.4.0"
description = "Core library of Islet: downloads, accounts, instances and game launch"
authors = ["saudade"]
license = "GPL-3.0-only"
repository = "https://github.com/saudademjj/islet-launcher"
edition = "2024"
rust-version = "1.96"

# The desktop shell (Tauri) lives in src-tauri and depends on this library.
[workspace]
members = ["src-tauri"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "gzip", "http2", "system-proxy", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "time", "sync", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"
zip = "9"
tar = "0.4"
flate2 = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
base64 = "0.23"
url = "2"
tiny_http = "0.12"
md5 = "0.8"
# Mojang texture signatures require RSA/SHA-1 for authlib compatibility.
rsa = "0.9"
sha1_compat = { package = "sha1", version = "0.10", features = ["oid"] }
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Screenshot thumbnails; already in the tree through Tauri.
png = "0.18"
# Joining Minecraft's LAN multicast group with address reuse (P2P rooms).
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
# Stripping proc-macro dylibs breaks Rust 1.96 release builds; strip the final
# binary in the packaging script instead.
strip = false
