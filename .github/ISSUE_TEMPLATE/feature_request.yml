name: 功能建议 / Feature request
description: 想要的新功能或改进 / Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题 / The problem
      description: 现在哪里不方便？/ What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望怎么解决 / What you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他启动器的做法或替代方案 / Alternatives or how other launchers do it
