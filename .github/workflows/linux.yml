name: Linux build
on:
  workflow_dispatch:
  # release.yml calls this for tagged releases.
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            deb: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            deb: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - name: Test
        run: cargo test --locked -p islet --all-targets
      - name: Package
        env:
          MC_LAUNCHER_CLIENT_ID: ${{ vars.MC_LAUNCHER_CLIENT_ID }}
          # The manifest release.yml attaches to the latest release.
          MC_LAUNCHER_UPDATE_URL: ${{ vars.MC_LAUNCHER_UPDATE_URL || format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) }}
        run: |
          # The runner's paths stay out of the binary's panic messages.
          export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/islet"
          npm ci
          npm test
          npm run tauri build -- --bundles deb,appimage
          # The AppImage replaces itself, so it is the Linux update package.
          # Both get names without spaces (the updater only takes plain names).
          version="$(awk -F'"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)"
          mkdir -p build
          cp target/release/bundle/appimage/*.AppImage "build/Islet-$version-${{ matrix.arch }}.AppImage"
          cp target/release/bundle/deb/*.deb "build/Islet-$version-${{ matrix.deb }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: Islet-Linux-${{ matrix.arch }}
          path: |
            build/*.AppImage
            build/*.deb
          if-no-files-found: error
