name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev python3-venv
      - name: Frontend typecheck, tests and build
        run: |
          npm ci
          npm test
          npm run build
      - name: Pixel font subset check
        if: runner.os == 'Linux'
        run: |
          python3 -m venv /tmp/font-venv
          /tmp/font-venv/bin/pip install --quiet fonttools brotli
          /tmp/font-venv/bin/python3 scripts/subset-font.py --check
      - name: Rust clippy and tests
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
